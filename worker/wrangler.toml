name = "vitepress-translation-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Serve the VitePress build output as static assets.
# serve_directly = true (default) means static assets are served
# without invoking the Worker. Only non-asset requests (e.g. /vi/about)
# reach the Worker for translation.
[assets]
directory = "../docs/.vitepress/dist"
binding = "ASSETS"

# Non-secret environment variables
[vars]
MODEL = "riva-translate-4b-instruct-v2"
CACHE_TTL = "604800"
